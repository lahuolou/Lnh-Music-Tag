name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Docker Hub 镜像（凭据来自仓库 Secrets：DOCKERHUB_USERNAME / DOCKERHUB_TOKEN）
  DOCKERHUB_IMAGE: lahuolou/lnh-music-tag

jobs:
  # 版本一致性校验：VERSION 文件是唯一版本源（编译期 embed 为 AppVersion），
  # Release tag 必须与 VERSION 内容一致，防止“检查更新”误报已是最新。
  version-check:
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify VERSION matches tag
        run: |
          ver=$(tr -d '[:space:]' < VERSION)
          tag=${GITHUB_REF#refs/tags/}
          tag=${tag#v}
          if [ "$ver" != "$tag" ]; then
            echo "::error::VERSION ($ver) does not match tag v$tag"
            exit 1
          fi
          echo "version ok: $ver == v$tag"

  # Go 测试门禁：gofmt 格式 + vet 静态检查 + 全量单测（含分页契约/插件/原子写/限速/品质测试）。
  # 任一失败即阻断镜像构建，防止未过测试的产物进入 GHCR。
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node (frontend for go:embed)
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend (produces web/dist for go:embed)
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files not formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        # -short：跳过依赖真实外网的测试（如 TestMiguLive），避免 CI 网络抖动误伤
        run: go test ./... -short

  # UI E2E：构建后端 + 生成测试音频并扫描 → 启动服务 → Playwright（Chromium）跑桌面/移动端冒烟。
  # 依赖 test 门禁；不参与镜像构建，仅作回归防线。
  e2e:
    runs-on: ubuntu-24.04
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend (produces web/dist for go:embed)
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build Go binary
        run: go build -o /tmp/lnh-server .
      - name: Prepare test audio library
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          mkdir -p /tmp/lnh-music
          for i in $(seq 1 60); do
            ffmpeg -loglevel error -f lavfi -i "sine=frequency=$((440 + i * 3)):duration=1" \
              -b:a 128k -metadata "title=E2E Track $i" -metadata "artist=E2E Artist" \
              -y "/tmp/lnh-music/track$i.mp3"
          done
          ls /tmp/lnh-music | wc -l
      - name: Start gateway and scan test library
        run: |
          LNH_PORT=:10248 LNH_CONFIG_DIR="$RUNNER_TEMP/lnh-cfg" LNH_STREAM_PASS=test \
          LNH_ADMIN_USER=admin LNH_ADMIN_PASS=admin123 /tmp/lnh-server > /tmp/lnh-server.log 2>&1 &
          echo "server pid: $!"
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:10248/api/version > /dev/null; then echo "ready after ${i}s"; break; fi
            sleep 1
          done
          curl -sf -c /tmp/lnh-cookies http://127.0.0.1:10248/api/login \
            -H 'Content-Type: application/json' \
            -d '{"user":"admin","pass":"admin123"}' > /dev/null || { cat /tmp/lnh-server.log; exit 1; }
          curl -sf -b /tmp/lnh-cookies http://127.0.0.1:10248/api/scan \
            -H 'Content-Type: application/json' \
            -d '{"dir":"/tmp/lnh-music"}' || { cat /tmp/lnh-server.log; exit 1; }
          for i in $(seq 1 60); do
            state=$(curl -sf -b /tmp/lnh-cookies http://127.0.0.1:10248/api/scan/status || echo '{}')
            echo "scan status: $state"
            if echo "$state" | grep -q '"running":false\|"idle":true'; then break; fi
            sleep 1
          done
      - name: Install Chromium and run UI E2E
        working-directory: web
        run: |
          sudo npx playwright-core install --with-deps chromium
          LNH_E2E_BASE=http://127.0.0.1:10248 LNH_E2E_USER=admin LNH_E2E_PASS=admin123 \
            node e2e/ui.e2e.mjs
      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-screenshots
          path: web/e2e/*.png
          if-no-files-found: warn

  build:
    runs-on: ubuntu-24.04
    needs: [test]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend (produces web/dist for go:embed)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Go binary (check)
        run: go build ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            docker.io/${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag
            # 四段版本（如 v1.0.0.0）非标准 semver，用 match 剥离 v 前缀得到纯数字标签 1.0.0.0
            type=match,pattern=v(.*),group=1,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
